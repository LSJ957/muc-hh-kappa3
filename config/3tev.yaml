# =====================================================================
#  3 TeV configuration  ·  μ+μ- → HHνν̄ → bbbbνν̄  ·  L = 1 ab⁻¹
# =====================================================================
stage:         3tev
sqrts_TeV:     3.0
data_dir:      data/3tev
models_dir:    models/3tev
analysis_dir:  analysis/3tev
dll_dir:       dll/3tev

# ── Analysis physics inputs (EDIT for your own MC set) ──────────────────────
# Luminosity, per-process background cross sections and the κ3 signal
# cross-section table are inputs, not code constants: replace them with the
# values of your own generation (MG banner "Integrated weight").
physics:
  lumi_fb_inv: 1000.0                       # 1 ab⁻¹
  # signal σ(μ+μ- → HHνν̄) [pb] per κ3 point (BR(H→bb)² applied in code).
  # Add/remove κ3 points freely — dll.fit_kappa_grid selects the scan.
  kappa3_xsec_pb:
    0.2: 0.0016855439
    0.4: 0.0014420082
    0.6: 0.0012382819
    0.8: 0.0010634673
    0.9: 0.0009909105
    1.0: 0.0009278950
    1.1: 0.0008725252
    1.2: 0.0008250127
    1.4: 0.0007583037
    1.6: 0.0007267047
    1.8: 0.0007312202
  # background processes: target_everytype id → name, σ [pb], and whether one
  # factor BR(H→bb) applies (single-Higgs backgrounds decayed to bb)
  backgrounds:
    1: {name: hqqvv, xsec_pb: 0.0054554757, apply_br_hbb: true}
    2: {name: wwvv,  xsec_pb: 0.0195176659}
    3: {name: zzvv,  xsec_pb: 0.0121599876}
    4: {name: ttvv,  xsec_pb: 0.0022278844}
    5: {name: ww,    xsec_pb: 0.0091913000}
    6: {name: zz,    xsec_pb: 0.0007549620}
    7: {name: tt,    xsec_pb: 0.0077916000}

# Root directory holding the raw Delphes .root files.  Resolved by
# `config_loader.resolve_paths`: env var `HHML_DATA_ROOT` takes precedence
# over this yaml value.  Replace this placeholder with your own path or
# `export HHML_DATA_ROOT=/your/path/to/HH-ML-MuC/Events_NonBoost/root_files`
# before running step 01_extract_features.py.
data_root:     /path/to/HH-ML-MuC/Events_NonBoost/root_files

# ─── Input registry ─────────────────────────────────────────────────
# Each h5 is built by 01_extract_features.py from the listed .root files.
# `target_*` / `kappa3` / `is_signal` fields stamp every event of the
# corresponding root.  Lists must align 1:1 with `roots` if per-file.
inputs:

  sigbg_main:
    h5: data/3tev/sigbg_main.h5
    n_gen_per_process: 500000
    roots:
      - ${data_root}/mm_hhx_3tev.root
      - ${data_root}/mm_hqqvv_3tev.root
      - ${data_root}/mm_wwvv_3tev.root
      - ${data_root}/mm_zzvv_3tev.root
      - ${data_root}/mm_ttvv_3tev.root
      - ${data_root}/mm_ww_3tev.root
      - ${data_root}/mm_zz_3tev.root
      - ${data_root}/mm_tt_3tev.root
    kappa3:           [1.0, null, null, null, null, null, null, null]   # signal → SM; bg → not applicable
    target_sigbg:     [1,   0,    0,    0,    0,    0,    0,    0]
    target_everytype: [0,   1,    2,    3,    4,    5,    6,    7]
    is_signal:        [true, false, false, false, false, false, false, false]

  # κ-scan : ALL k₂V=1 samples (main 0.1-spacing + fine 0.01-spacing in [0.91,1.09])
  kappa_scan_main:
    h5: data/3tev/kappa_scan_main.h5
    n_gen_per_kappa: 100000
    roots:
      # the 11-point paper scan grid (dll.fit_kappa_grid)
      - ${data_root}/mm_hhx_kappa_k3_0.2_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_0.4_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_0.6_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_0.8_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_0.9_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_1.0_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_1.1_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_1.2_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_1.4_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_1.6_k2v_1_3tev.root
      - ${data_root}/mm_hhx_kappa_k3_1.8_k2v_1_3tev.root
    kappa3: [0.2, 0.4, 0.6, 0.8, 0.9, 1.0, 1.1, 1.2, 1.4, 1.6, 1.8]
    target_sigbg:     1
    target_everytype: 0
    is_signal:        true

  kappa_indep:
    h5: data/3tev/kappa_indep.h5
    n_gen_per_kappa: 100000
    roots:
      - ${data_root}/mm_hhx_kappa_k3_0.4_k2v_1_3tev_indep.root
      - ${data_root}/mm_hhx_kappa_k3_1.0_k2v_1_3tev_indep.root
      - ${data_root}/mm_hhx_kappa_k3_1.6_k2v_1_3tev_indep.root
    kappa3: [0.4, 1.0, 1.6]
    target_sigbg:     1
    target_everytype: 0
    is_signal:        true

# ─── ML usage ────────────────────────────────────────────────────────
ml_usage:
  spanet:
    train: [sigbg_main]                # truth_valid signal jets from sigbg
  ml1:
    sigbg: [sigbg_main]
  ml2:
    kappa_low:  0.4
    kappa_high: 1.6
    source: [kappa_scan_main, kappa_indep]

# ─── DLL analysis ────────────────────────────────────────────────────
dll:
  fit_kappa_grid: [0.2, 0.4, 0.6, 0.8, 0.9, 1.0, 1.1, 1.2, 1.4, 1.6, 1.8]
  # PRIORITY ORDER (first listed wins when multiple sources share a κ value):
  # kappa_indep first: the κ=1 reference is fully training-independent; at the
  # ML2 training κ (0.4/1.6) the kappa_indep events partly enter ML2 training,
  # so 07 additionally restricts those templates to ML2's test fold (rescaled)
  template_sources:  [kappa_indep, kappa_scan_main]
  anchor:
    source: kappa_indep
    kappa:  1.0

# Optuna HP-search settings.  Re-tuning is driven by `bash run_all.sh --retune-spanet`
# and `bash run_all.sh --retune-ml` (and the 02a / 04a / 05a scripts directly), not by
# any yaml flag.  `from_best` is a fallback path used only when no local
# `models/<stage>/{ml1,ml2}_best.json` exists — leave it as the relative
# sentinel below; the active pipeline writes a local best.json from Optuna or
# the user passes `--from-best`.
optuna:
  spanet:
    n_trials: 30
    epochs_per_trial: 20
    safety_factor: 1.0                # prune trial if n_params×k > N_train_truth_valid
  ml1:
    from_best: __none__               # no local best.json → must pass --from-best
    n_trials: 20
    epochs_per_trial: 15
    safety_factor: 2.0
  ml2:
    from_best: __none__               # no local best.json → must pass --from-best
    n_trials: 20
    epochs_per_trial: 25
    safety_factor: 2.0

training:
  seed: 42
  split: [0.70, 0.15, 0.15]   # 70/15/15 is fixed in lib/splits.py; only
                              # split[1] (SPANet val fraction) is read by 02a
  epochs_final: 55
